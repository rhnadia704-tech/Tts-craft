name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare build environment
      run: |
        # 1. Configurer .env
        touch .env
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        else
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
        fi

        # 2. Restaurer ou générer debug.keystore pour debugConfig
        if [ -f debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi

        if [ ! -f debug.keystore ]; then
          echo "Generating debug.keystore with keytool..."
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        ls -lh debug.keystore

        # 3. Permissions d'exécution sur le Gradle wrapper
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: EdgeTTS-Pro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        retention-days: 14
